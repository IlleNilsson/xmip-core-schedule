[package]
name = "xmip-core-schedule"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-schedule"
description = "Decides when Xmip work runs: a Receive Location's rest between receives, and when a Send Port queue's earliest retry is due."

[lib]
path = "src/lib.rs"

# No dependency: what it decides is read from a clock and durations alone,
# and the runtime that waits and acts on it depends on it, never the other
# way (ADR-0058, amendment 2026-11-13).

[lints]
workspace = true
